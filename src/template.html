  if(saved?.version===2){language=saved.language==='zh'?'zh':'en';sound=saved.sound===true;records=FlushCampaign.normalizeRecords(LEVELS,saved.records);current=Number.isInteger(saved.current)&&saved.current>=0?Math.min(saved.current,unlockedThrough()):unlockedThrough();}

function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||''}</svg>`;}

function counts(){let c=0,f=0,g=0;LEVELS.forEach(l=>{const r=records[l.id];if(FlushCampaign.validRecord(l,r)){c++;if(r.flushed)f++;if(r.best===l.optimalMoves)g++;}});return {c,f,g};}
function unlockedThrough(){return FlushCampaign.unlockedThrough(LEVELS,records);}
function isUnlocked(index){return FlushCampaign.isUnlocked(LEVELS,records,index);}
function persist(){try {localStorage.setItem(KEY,JSON.stringify({version:2,language,sound,records,current,session:state?{level:LEVELS[current].id,values:state.values,moves:state.moves,history:state.history,phase:state.phase==='flushing'?'won':state.phase}:null}));storageAvailable=true;}catch(e){storageAvailable=false;}const footer=$('footerNote');if(footer)footer.textContent=t('footer')+(storageAvailable?'':' '+t('sessionOnly'));}
function announce(message){$('feedback').textContent=message;}
function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2400);}
function recordClear(){const l=LEVELS[current],r=records[l.id];records[l.id]={cleared:true,best:FlushCampaign.validRecord(l,r)?Math.min(r.best,state.moves):state.moves,flushed:r?.flushed===true,signature:FlushCampaign.signature(l)};persist();}
function validSavedSession(session){const level=LEVELS[current];return FlushCampaign.validSession(level,session,records[level.id]);}
function loadLevel(index,restore=false){
  if(state?.phase==='flushing')return false;
  if(!isUnlocked(index)){if(Number.isInteger(index)&&index>0&&index<LEVELS.length)toast(t('lockedHint',index));return false;}
  animationToken++;closeModal();current=index;const l=LEVELS[current];
  state={values:l.initial.slice(),moves:0,history:[],phase:'playing'};hintStep=0;feedbackOverride='';
  if(restore&&validSavedSession(saved?.session)){const ss=saved.session;state={values:ss.values.slice(),moves:ss.moves,history:ss.history.map(a=>a.slice()),phase:ss.phase==='flushed'?'flushed':FlushRules.phase(ss.values,l.threshold,ss.moves,l.moveLimit)};}
  renderAll();persist();
  if(!restore){$('levelTitle').setAttribute('tabindex','-1');$('levelTitle').focus();}
  if(state.phase==='won'){recordClear();renderCampaign();feedbackOverride=t('reloadWon');renderStatus();const restoredLevel=current;setTimeout(()=>{if(current===restoredLevel&&state.phase==='won'&&!$('modal').open&&!FlushSharing.isOpen())openVictory();},150);}
  return true;
}
function levelButtons(){return LEVELS.map((l,i)=>{
  const r=records[l.id],locked=!isUnlocked(i),gold=r?.cleared&&r.best===l.optimalMoves,award=locked?icon('lock'):gold?'✦':r?.cleared?'✓':'';
  const meta=locked?t('lockedHint',i):`${t(l.difficulty)} · ${t('budget',l.moveLimit)}`;
  const label=`${i+1}. ${ltext(l.name)}, ${t(l.difficulty)}, ${t('budget',l.moveLimit)}${locked?', '+t('lockedHint',i):''}`;
  return `<button type="button" class="level-btn ${l.difficulty} ${i===current?'current':''} ${locked?'locked':''}" data-level="${i}" ${i===current?'aria-current="step"':''} ${locked?'disabled aria-disabled="true"':''} aria-label="${escape(label)}"><span class="level-number">${String(i+1).padStart(2,'0')}</span><span class="level-copy"><span class="level-name">${escape(ltext(l.name))}</span><span class="level-meta"><i class="difficulty-dot"></i>${escape(meta)}</span></span><span class="level-award ${gold?'gold':''}" aria-hidden="true">${award}</span></button>`;
}).join('');}
function renderCampaign(){const c=counts();$('tourProgress').textContent=t('progress',c.c,c.g);$('progressSegments').innerHTML=LEVELS.map(l=>`<span class="${records[l.id]?.cleared?'done':''}"></span>`).join('');$('levelList').innerHTML=levelButtons();revealCurrentRoom();}
function revealCurrentRoom(){const list=$('levelList'),button=list.querySelector('[aria-current="step"]');if(!button)return;const view=list.getBoundingClientRect(),room=button.getBoundingClientRect();if(room.top<view.top)list.scrollTop-=view.top-room.top+4;else if(room.bottom>view.bottom)list.scrollTop+=room.bottom-view.bottom+4;}

function renderHeading(){const l=LEVELS[current];$('roomCount').textContent=language==='en'?`ROOM ${String(current+1).padStart(2,'0')} / ${LEVELS.length}`:`第 ${String(current+1).padStart(2,'0')} / ${LEVELS.length} 关`;$('difficulty').className='tier '+l.difficulty;$('difficulty').textContent=t(l.difficulty);$('levelTitle').textContent=ltext(l.name);$('tagline').textContent=ltext(l.tagline);$('missionTitle').innerHTML=t('mission',l.threshold);document.querySelector('.floor-mark').textContent=`FH / ${String(current+1).padStart(2,'0')}`;}
function boardGeometry(){return flushGeometry(LEVELS[current],$('board').clientWidth);}
function renderBoard(){if(!state)return;const l=LEVELS[current],{w,h,points}=boardGeometry();$('board').style.height=h+'px';$('pipes').setAttribute('viewBox',`0 0 ${w} ${h}`);$('pipes').innerHTML=l.edges.map(([a,b],i)=>{const p=points[a],q=points[b],x=(p.x+q.x)/2,y=(p.y+q.y)/2-15,dy=-15;return `<g class="edge" role="button" tabindex="0" data-edge="${i}" aria-label="${escape(`${t('pipe')} ${l.nodes[a].id}–${l.nodes[b].id}`)}"><title>${escape(`${l.nodes[a].id} ↔ ${l.nodes[b].id}`)}</title><line class="pipe-hit" x1="${p.x}" y1="${p.y+dy}" x2="${q.x}" y2="${q.y+dy}"/><line class="pipe-back" x1="${p.x}" y1="${p.y+dy}" x2="${q.x}" y2="${q.y+dy}"/><line class="pipe-front" x1="${p.x}" y1="${p.y+dy}" x2="${q.x}" y2="${q.y+dy}"/><line class="pipe-shine" x1="${p.x}" y1="${p.y+dy-2}" x2="${q.x}" y2="${q.y+dy-2}"/><circle class="pipe-handle" cx="${x}" cy="${y}" r="13"/><path class="pipe-arrow" d="M${x-6} ${y-3}h12m-3-3 3 3-3 3M${x+6} ${y+4}H${x-6}m3-3-3 3 3 3"/></g>`;}).join('');$('toilets').innerHTML=l.nodes.map((n,i)=>`<div class="toilet" id="toilet-${i}" role="img" style="left:${points[i].x}px;top:${points[i].y}px"><span class="node-id">${n.id}</span><div class="toilet-illustration" id="art-${i}"></div><div class="waste-label"><span class="waste-number" id="waste-${i}"></span><span class="percent-sign">%</span></div></div>`).join('');updateBoard();}
function updateBoard(changed=[]){const l=LEVELS[current];l.nodes.forEach((n,i)=>{const v=state.values[i],ready=v<=l.threshold,e=$('toilet-'+i);if(!e)return;e.className=`toilet ${ready?'ready':'too-full'} ${changed.includes(i)?'bump':''}`;e.setAttribute('aria-label',`${t('toilet')} ${n.id}: ${percent(v)}%, ${state.phase==='flushed'?t('cleanNode'):t(ready?'belowLimit':'atLimit')}`);e.title=`${n.id}: ${FlushRules.percent(v,Infinity)}% / ≤ ${l.threshold}%`;$('art-'+i).innerHTML=toiletSvg('board-'+i,v,l.threshold,state.phase==='flushed'?'drained':'idle');$('waste-'+i).textContent=percent(v);$('waste-'+i).parentElement.style.fontSize=percent(v).length>5?Math.min(14,96/percent(v).length)+'px':'';});document.querySelectorAll('.edge').forEach(e=>{const disabled=state.phase!=='playing';e.setAttribute('aria-disabled',String(disabled));e.setAttribute('tabindex',disabled?'-1':'0');const[a,b]=l.edges[Number(e.dataset.edge)];e.setAttribute('aria-label',`${t('pipe')} ${l.nodes[a].id} (${percent(state.values[a])}%) – ${l.nodes[b].id} (${percent(state.values[b])}%)`);});$('board').classList.toggle('is-flushing',state.phase==='flushing');$('flushCaption').hidden=state.phase!=='flushing';}
function renderStatus(){const l=LEVELS[current],phase=state.phase;$('movesValue').innerHTML=`${state.moves} <small>/ ${l.moveLimit}</small>`;$('movesValue').classList.toggle('warning',phase==='playing'&&l.moveLimit-state.moves<=2);$('readyValue').innerHTML=`${FlushRules.readyCount(state.values,l.threshold)} <small>/ ${l.nodes.length}</small>`;$('highestValue').innerHTML=`${percent(Math.max(...state.values))}<small>%</small>`;$('totalWaste').textContent=t('total',FlushRules.percent(FlushRules.total(state.values)));$('undoBtn').disabled=!state.history.length||phase==='flushed'||phase==='flushing';$('restartBtn').disabled=phase==='flushing';$('hintBtn').disabled=phase==='flushing'||phase==='flushed';$('levelsBtn').disabled=phase==='flushing';$('languageBtn').disabled=phase==='flushing';$('guideBtn').disabled=phase==='flushing';$('shareBtn').disabled=phase==='flushing';document.querySelectorAll('[data-level]').forEach(e=>{e.disabled=phase==='flushing'||!isUnlocked(Number(e.dataset.level));e.setAttribute('aria-disabled',String(e.disabled));});let message=phase==='playing'?(feedbackOverride||(state.moves?t('remaining',l.moveLimit-state.moves):t('click'))):phase==='won'?t('wonFeedback'):phase==='failed'?t('noMoves'):phase==='flushing'?t('flushing'):t('flushedNote');announce(message);const b=$('completedBanner');b.hidden=!['won','flushed'].includes(phase);if(phase==='won')b.innerHTML=`<div><div class="completed-title">${t('victoryTitle')}</div><div class="completed-note">${t(current<LEVELS.length-1?'nextUnlocked':'campaignComplete',current+2)}</div></div><button class="btn yellow" data-action="flush">${icon('flush')}${t('flush')}</button>`;else if(phase==='flushed')b.innerHTML=`<div><div class="completed-title">${t('flushed')}</div><div class="completed-note">${counts().c===LEVELS.length?t('allDoneFeedback'):t('flushedNote')}</div></div><button class="btn primary" data-action="next">${t(current<LEVELS.length-1?'next':'tour')}${icon('arrow')}</button>`;renderHint();}
function renderAll(){renderLanguage();renderCampaign();renderHeading();renderBoard();renderStatus();}
function move(edgeIndex){if(state.phase!=='playing'||!LEVELS[current].edges[edgeIndex])return;const l=LEVELS[current],edge=l.edges[edgeIndex],result=FlushRules.average(state.values,edge);if(!result.changed){toast(t('equal'));return;}state.history.push(state.values.slice());state.values=result.values;state.moves++;state.phase=FlushRules.phase(state.values,l.threshold,state.moves,l.moveLimit);feedbackOverride=t('mix',l.nodes[edge[0]].id,l.nodes[edge[1]].id,percent(state.values[edge[0]]));updateBoard(edge);renderStatus();const active=document.querySelector(`[data-edge="${edgeIndex}"]`);active?.classList.add('just-used');setTimeout(()=>active?.classList.remove('just-used'),420);playSound('tap');if(state.phase==='won'){recordClear();renderCampaign();openVictory();}else if(state.phase==='failed')openFailure();persist();}
function undo(){if(!state.history.length||['flushing','flushed'].includes(state.phase))return;closeModal();state.values=state.history.pop();state.moves--;state.phase='playing';feedbackOverride='';updateBoard();renderStatus();persist();}
function restart(){if(state.phase==='flushing')return;loadLevel(current);}
function renderHint(){const e=$('hintPanel');e.hidden=!hintStep;if(hintStep){const hints=LEVELS[current].hints[language]||LEVELS[current].hints.en;e.innerHTML=`<div class="hint-heading">${t('hintLabel')}</div><p>${escape(hints.slice(0,hintStep).join(' '))}</p><button class="hint-more" data-action="${hintStep<hints.length?'moreHint':'hideHint'}">${t(hintStep<hints.length?'nextHint':'hideHint')}</button>`;}}
function closeModal(){if($('modal').open)$('modal').close();modalKind='';}
function showModal(kind,html){modalKind=kind;$('modalContent').innerHTML=html;if(!$('modal').open)$('modal').showModal();}
function closeButton(){return `<button type="button" class="dialog-close" data-action="close" aria-label="${t('close')}">×</button>`;}
function openVictory(){const l=LEVELS[current];showModal('victory',`<div class="dialog-body celebration">${closeButton()}<div class="dialog-art">${toiletSvg('dialog-win',0,l.threshold,'drained')}</div><div class="dialog-eyebrow">${t('room')} ${String(current+1).padStart(2,'0')} · ${ltext(l.name)}</div><h2 class="dialog-title" id="modalTitle">${t('victoryTitle')}</h2><p class="dialog-text">${t('victoryText',l.threshold)}</p><p class="unlock-notice">${t(current<LEVELS.length-1?'nextUnlocked':'campaignComplete',current+2)}</p>${state.moves<=l.optimalMoves?`<div class="achievement-chip">${t('perfect')}</div>`:''}<div class="dialog-stats"><div class="dialog-stat"><strong>${state.moves} / ${l.moveLimit}</strong><span>${t('movesUsed')}</span></div><div class="dialog-stat"><strong>${percent(Math.max(...state.values))}%</strong><span>${t('maxWaste')}</span></div></div><button type="button" class="btn yellow dialog-primary" data-action="flush">${icon('flush')}${t('flush')}</button><button type="button" class="dialog-secondary" data-action="close">${t('inspect')}</button></div>`);playSound('win');}
function openFailure(){const l=LEVELS[current];showModal('failure',`<div class="dialog-body">${closeButton()}<div class="dialog-eyebrow">${t('room')} ${current+1}</div><h2 class="dialog-title" id="modalTitle">${t('lossTitle')}</h2><p class="dialog-text">${t('lossText',l.moveLimit)}</p><div style="display:grid;gap:10px;margin-top:23px"><button class="btn primary dialog-primary" data-action="undo">${icon('undo')}${t('undoMove')}</button><button class="btn dialog-primary" data-action="restart">${icon('restart')}${t('tryAgain')}</button></div></div>`);}
function openGuide(){showModal('guide',`<div class="dialog-body">${closeButton()}<div class="dialog-eyebrow">${t('guide')}</div><h2 class="dialog-title" id="modalTitle">${t('guideTitle')}</h2><p class="dialog-text">${t('guideIntro')}</p>${[1,2,3,4].map(i=>`<div class="guide-step"><div class="step-number">0${i}</div><div><h3>${t('step'+i+'Title')}</h3><p>${t('step'+i)}</p></div></div>`).join('')}<p class="guide-fine">${t('keyboard')}</p><button class="btn primary dialog-primary" style="margin-top:19px" data-action="close">${t('play')}</button></div>`);}
function openPicker(){showModal('picker',`<div class="dialog-body">${closeButton()}<div class="dialog-eyebrow">${t('tourLabel')}</div><h2 class="dialog-title" id="modalTitle">${t('pickerTitle')}</h2><p class="picker-note">${t('pickerIntro')}</p><div class="picker-list">${levelButtons()}</div></div>`);}
function openTourComplete(){const c=counts();showModal('tour',`<div class="dialog-body celebration">${closeButton()}<div class="dialog-art">${toiletSvg('dialog-tour',0,50,'drained')}</div><div class="dialog-eyebrow">FLUSH HOUR</div><h2 class="dialog-title" id="modalTitle">${c.f===LEVELS.length?t('freshTitle'):t('campaignComplete')}</h2><p class="dialog-text">${c.f===LEVELS.length?t('freshAll'):t('freshSome',c.f)}</p><div class="achievement-chip">${t('perfectCount',c.g)}</div><button style="margin-top:22px" class="btn primary dialog-primary" data-action="picker">${t('keepExploring')}${icon('arrow')}</button></div>`);}
function flush(){if(state.phase!=='won')return;closeModal();const l=LEVELS[current],snapshot=state.values.slice(),token=++animationToken,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,stagger=reduce?0:65,duration=reduce?300:1900+stagger*(snapshot.length-1);state.phase='flushing';renderStatus();$('board').classList.add('is-flushing');$('flushCaption').hidden=false;$('flushCaption').textContent=t('flushing');l.nodes.forEach((n,i)=>{$('art-'+i).innerHTML=toiletSvg('flushing-'+i,snapshot[i],l.threshold,'flushing');$('art-'+i).querySelectorAll('.tank-button,.waste-column,.water-wash,.flush-swirl,.flush-sparkles').forEach(e=>e.style.animationDelay=(i*stagger)+'ms');});document.querySelectorAll('.edge').forEach(e=>{e.setAttribute('aria-disabled','true');e.setAttribute('tabindex','-1');});playSound('flush');persist();const start=performance.now();function frame(now){if(token!==animationToken)return;const elapsed=now-start;l.nodes.forEach((n,i)=>{const f=reduce?Math.min(1,elapsed/duration):Math.max(0,Math.min(1,(elapsed-i*stagger-230)/1670));$('waste-'+i).textContent=FlushRules.percent(snapshot[i]*(1-f),l.threshold);});if(elapsed<duration+90)requestAnimationFrame(frame);else{state.values=state.values.map(()=>0);state.phase='flushed';state.history=[];records[l.id]={...records[l.id],flushed:true};renderBoard();renderStatus();renderCampaign();persist();$('completedBanner').querySelector('[data-action=next]')?.focus();if(current===LEVELS.length-1||counts().f===LEVELS.length)setTimeout(()=>{if(token===animationToken&&state.phase==='flushed'&&!$('modal').open&&!FlushSharing.isOpen())openTourComplete();},500);}}requestAnimationFrame(frame);}
function playSound(kind){if(!sound)return;try {audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});const now=audioCtx.currentTime;if(kind==='flush'){const d=2.1,buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*d,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.6;const source=audioCtx.createBufferSource();source.buffer=buffer;const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.setValueAtTime(1200,now);filter.frequency.exponentialRampToValueAtTime(160,now+d);const gain=audioCtx.createGain();gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.14,now+.25);gain.gain.exponentialRampToValueAtTime(.001,now+d);source.connect(filter).connect(gain).connect(audioCtx.destination);source.start(now);source.stop(now+d);return;}const notes=kind==='win'?[523,659,784]:[400];notes.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(f,now+i*.1);g.gain.setValueAtTime(.001,now+i*.1);g.gain.exponentialRampToValueAtTime(.07,now+i*.1+.015);g.gain.exponentialRampToValueAtTime(.001,now+i*.1+.18);o.connect(g).connect(audioCtx.destination);o.start(now+i*.1);o.stop(now+i*.1+.2);});}catch(e){sound=false;renderLanguage();}}
document.addEventListener('click',event=>{const level=event.target.closest('[data-level]');if(level){if(state.phase!=='flushing'&&!level.disabled)loadLevel(Number(level.dataset.level));return;}const edge=event.target.closest('[data-edge]');if(edge){move(Number(edge.dataset.edge));return;}const action=event.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='close')closeModal();if(action==='flush')flush();if(action==='undo')undo();if(action==='restart')restart();if(action==='picker')openPicker();if(action==='moreHint'){hintStep++;renderHint();}if(action==='hideHint'){hintStep=0;renderHint();}if(action==='next'){if(current<LEVELS.length-1){if(loadLevel(current+1))window.scrollTo({top:0,left:0,behavior:'instant'});}else openPicker();}});
$('pipes').addEventListener('keydown',event=>{const e=event.target.closest('[data-edge]');if(e&&(event.key==='Enter'||event.key===' ')){event.preventDefault();move(Number(e.dataset.edge));}});
$('languageBtn').addEventListener('click',()=>{if(state.phase==='flushing')return;const oldKind=modalKind;language=language==='en'?'zh':'en';feedbackOverride='';renderAll();persist();if(oldKind==='victory')openVictory();if(oldKind==='failure')openFailure();if(oldKind==='guide')openGuide();if(oldKind==='picker')openPicker();if(oldKind==='tour')openTourComplete();});
$('soundBtn').addEventListener('click',()=>{sound=!sound;if(!sound&&audioCtx)audioCtx.suspend().catch(()=>{});renderLanguage();persist();if(sound)playSound('tap');});
$('shareBtn').addEventListener('click',()=>{if(state.phase==='flushing')return;closeModal();FlushSharing.open(language);});
$('guideBtn').addEventListener('click',openGuide);$('levelsBtn').addEventListener('click',openPicker);$('undoBtn').addEventListener('click',undo);$('restartBtn').addEventListener('click',restart);$('hintBtn').addEventListener('click',()=>{hintStep=hintStep?0:1;renderHint();});
$('modal').addEventListener('close',()=>modalKind='');
$('modal').addEventListener('click',event=>{if(event.target===$('modal')){const r=$('modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
document.addEventListener('keydown',event=>{if($('modal').open||FlushSharing.isOpen()||event.altKey||event.ctrlKey||event.metaKey||event.target.matches('input,textarea,select')||state.phase==='flushing')return;const key=event.key.toLowerCase();if(key==='u'){event.preventDefault();undo();}if(key==='r'){event.preventDefault();restart();}if(key==='h'&&!['flushed','flushing'].includes(state.phase)){event.preventDefault();hintStep=hintStep?0:1;renderHint();}});
let lastWidth=0;new ResizeObserver(entries=>{const width=Math.round(entries[0].contentRect.width);if(width!==lastWidth){lastWidth=width;if(state&&state.phase!=='flushing')renderBoard();}}).observe($('board'));
loadLevel(current,true);
})();
</script>
